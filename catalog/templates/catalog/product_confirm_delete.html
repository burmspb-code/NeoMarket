{% extends 'catalog/base.html' %}

{% block title %}Подтверждение удаления — NeoMarket{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 p-4 text-center">
                
                <!-- Иконка предупреждения -->
                <div class="text-danger mb-3">
                    <i class="bi bi-exclamation-triangle display-1"></i>
                </div>
                
                <h1 class="h3 fw-bold text-dark mb-3">Удаление товара</h1>
                
                <p class="text-muted mb-4">
                    Вы уверены, что хотите навсегда удалить товар <strong class="text-dark">«{{ object.name }}»</strong>? Это действие нельзя будет отменить.
                </p>
                
                <!-- Форма, которая отправит финальный POST запрос на удаление -->
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg fw-bold py-2">
                            <i class="bi bi-trash me-2"></i>Да, удалить окончательно
                        </button>
                        <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
