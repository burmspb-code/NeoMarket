<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Динамический заголовок вкладки -->
    <title>{% block title %}NeoMarket — Магазин замков и фурнитуры{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="static/catalog/css/bootstrap.min.css" rel="stylesheet">
    <!-- Иконки Bootstrap -->
    <link href="static/catalog/css/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Шапка сайта (Навигация) -->
    <header class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-shield-lock-fill text-warning me-2"></i>NeoMarket
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-house-door me-1"></i>Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-grid me-1"></i>Каталог</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Основной контент страницы (сюда Django вставит код дочерних шаблонов) -->
    <div class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Подвал сайта -->
    <footer class="bg-dark text-light py-4 mt-auto border-top border-secondary">
        <div class="container text-center">
            <p class="mb-1">&copy; {% now "Y" %} NeoMarket. Все права защищены.</p>
            <small class="text-muted">Замки, дверная фурнитура и системы безопасности</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="static/catalog/js/bootstrap.bundle.min.js"></script>
</body>
</html>
