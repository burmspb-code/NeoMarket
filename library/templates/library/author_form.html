<!-- library/templates/library/author_form.html -->
{% extends 'library/base.html' %}

{% block title %}Форма автора{% endblock %}

{% block content %}
{% include 'library/header.html' %}
<h2>Форма автора</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'library:authors_list' %}" class="btn btn-primary">Отменить</a>
</form>
{% endblock %}
