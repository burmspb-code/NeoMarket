[project]
name = "neomarket"
version = "0.1.0"
description = "E-commerce platform backend"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "django-phonenumber-field[phonenumberslite] (>=8.4.0,<9.0.0)",
    "phonenumbers (>=9.0.34,<10.0.0)",
    "django-countries (>=9.0.0,<10.0.0)",
    "django-recaptcha (>=4.1.0,<5.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "django-debug-toolbar (>=7.0.0,<8.0.0)",
    "pytils (>=0.4.4,<0.5.0)",
    "celery (>=5.6.3,<6.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "eventlet (>=0.41.1,<0.42.0)"
]
[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.14,<0.16.0)",
    "ipython (>=9.13.0,<10.0.0)",
    "poetry-core (>=2.4.1,<3.0.0)"
]
