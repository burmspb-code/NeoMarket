<!-- users/templates/users/password_reset_complete.html -->
{% extends 'catalog/base.html' %}

{% block title %}Пароль успешно изменен{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <!-- Карточка успешного завершения -->
            <div class="card shadow border-0 rounded-3 text-center">
                <div class="card-body p-4 p-sm-5">
                    <!-- Иконка зеленого щита с галочкой -->
                    <div class="mb-4">
                        <i class="bi bi-shield-check text-success" style="font-size: 4rem;"></i>
                    </div>

                    <h2 class="card-title mb-3 fw-bold text-dark">Готово!</h2>

                    <p class="text-muted small mb-4">
                        Ваш старый пароль был успешно сброшен. Новый пароль уже вступил в силу, и теперь вы можете войти в систему.
                    </p>

                    <!-- Кнопка перехода к авторизации -->
                    <div class="d-grid gap-2">
                        <a href="{% url 'users:login' %}" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Войти на сайт
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
