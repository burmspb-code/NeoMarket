{% extends 'catalog/base.html' %}

{% block title %}Подтверждение регистрации{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="card shadow border-0 p-5 mx-auto" style="max-width: 500px;">
        <i class="bi bi-envelope-check text-success display-1 mb-4"></i>
        <h2 class="fw-bold mb-3">Проверьте вашу почту</h2>
        <p class="text-muted">Мы отправили ссылку для активации аккаунта на ваш электронный адрес. Пожалуйста, перейдите по ней, чтобы завершить регистрацию.</p>
        <a href="{% url 'users:login' %}" class="btn btn-primary mt-3">Перейти к авторизации</a>
    </div>
</div>
{% endblock %}
