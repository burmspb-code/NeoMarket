{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи — NeoMarket{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm border-0 p-5">
                <i class="bi bi-exclamation-triangle text-danger display-1 mb-4"></i>
                <h1 class="h3 fw-bold mb-3">Удалить статью?</h1>
                <p class="text-muted mb-4">Вы уверены, что хотите безвозвратно удалить статью <strong>«{{ object.title }}»</strong>?</p>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg px-4 me-2 fw-bold">Да, удалить</button>
                    <a href="{% url 'blog:detail' object.pk %}" class="btn btn-outline-secondary btn-lg px-4">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
